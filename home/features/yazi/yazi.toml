# Minimal Yazi configuration; unspecified options use the defaults.

[opener]
# Keep the editor open after Yazi exits.
edit = [
{ run = 'foot --title=nvim nvim %s', for = "unix", orphan = true, desc = "Edit" },
]

# Keep applications launched by `open` and `reveal` running after Yazi exits.
open = [
{ run = "xdg-open %s1", desc = "Open", for = "linux", orphan = true },
]
reveal = [
{ run = "xdg-open %d1", desc = "Reveal", for = "linux", orphan = true },
]

# Google Chrome
chrome = [
{ run = 'google-chrome-stable %s', desc = "Chrome", for = "linux", orphan = true },
]

[open]
# prepend_rules preserves Yazi's default rules.
prepend_rules = [
{ url = "*.{html,htm,xhtml}", use = [ "open", "edit" ] }, # → Chrome
{ url = "*.csv", use = [ "open", "edit" ] },               # → Calc
{ url = "*.pdf", use = [ "open", "chrome", "edit" ] },     # PDF: Sioyek by default; choose Chrome with O.
]

[mgr]
# Other manager options use Yazi's defaults. Foot's SIXEL support enables image previews.
# The packaged Yazi wrapper includes tools for PDF, video, and SVG previews.
