name: Nix checks

# Only run on main for pushes so internal PRs do not run twice.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v20

      # Check formatting (nixfmt from the flake).
      - name: Check Nix format
        run: nix fmt -- --check

      # Check the flake (skip builds).
      - name: Check Nix flake
        run: nix flake check --no-build --show-trace

      - name: Test workflow regressions
        if: github.event_name == 'workflow_dispatch'
        run: nix build .#checks.x86_64-linux.workflows --no-link --print-build-logs
